# config/organizer.conf
#
# Sourced by organizer.sh as plain Bash — a full YAML/JSON parser was
# deliberately avoided to keep the project dependency-free.
#
# This file is optional. Delete or empty it to use built-in defaults.
# Values set here OVERRIDE the defaults in organizer.sh, and array
# assignments here are ADDED to (or override individual keys of) the
# EXT_TO_CATEGORY mapping defined in lib/categorize.sh — which is
# already sourced by the time this file loads.

# --- General ------------------------------------------------------------

# Name of the log/history subdirectory created inside the target
# directory (relative to TARGET_DIR).
LOG_DIR_NAME="logs"

# Safety cap on duplicate-filename resolution attempts (photo_1.jpg,
# photo_2.jpg, ...) before safe_move() gives up and reports a failure
# for that file, rather than looping forever.
MAX_DUPLICATE_ATTEMPTS=9999

# --- Category mapping overrides -----------------------------------------
#
# Add or override extension -> category mappings here. Keys are
# lowercase, without a leading dot. Examples (uncomment to use):
#
# EXT_TO_CATEGORY[heic]="Images"
# EXT_TO_CATEGORY[epub]="Ebooks"
# EXT_TO_CATEGORY[log]="Others"       # re-route .log files to Others
# EXT_TO_CATEGORY[md]="Documents"     # treat Markdown as a Document
